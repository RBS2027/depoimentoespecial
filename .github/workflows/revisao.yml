name: Revisao do site
on:
  schedule:
    - cron: '45 10 * * *'   # diariamente as 07h45 de Brasilia, apos a publicacao do dia
  push:
    branches: [main]         # e imediatamente apos qualquer alteracao no site
  workflow_dispatch: {}      # e manualmente, quando quiser
concurrency:
  group: revisao
  cancel-in-progress: true
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar bateria de verificacoes
        run: python3 scripts/revisao.py
