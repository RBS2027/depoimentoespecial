name: Publicar artigo diario
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar proximo artigo da fila
        id: publicar
        run: |
          python scripts/publicar.py | tee /tmp/publicar.log
          URL=$(grep "^INDEXNOW_URL=" /tmp/publicar.log | cut -d= -f2-)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Notificar IndexNow (Bing/Yandex)
        if: steps.publicar.outputs.url != ''
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"depoimentoespecial.com.br","key":"9464809730abec9a7e1cbb95623945ff","keyLocation":"https://depoimentoespecial.com.br/9464809730abec9a7e1cbb95623945ff.txt","urlList":["${{ steps.publicar.outputs.url }}"]}' \
            || echo "IndexNow ping falhou (nao critico, nao interrompe a publicacao)"
      - name: Commit e push
        run: |
          git config user.name "robo-publicador"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publicacao diaria automatica"
          git push
      - name: Instrucao em caso de falha
        if: failure()
        run: |
          echo "::error title=ABRA O CLAUDE E DIGA::Claude, conserta os sites — chegou alarme do GitHub (publicacao diaria). Ele investiga a causa e corrige sozinho."
