name: Vigilância dos 4 sites
on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas
  workflow_dispatch:
concurrency: vigilancia
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar os 4 sites e autocurar publicacao atrasada
        shell: python
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          import urllib.request, sys, os
          SITES = {
            "https://depoimentoespecial.com.br/": ["Perito em Psicologia Forense", "wa.me/5512997402674"],
            "https://estudopsicossocial.com.br/": ["Perito em Psicologia Forense", "wa.me/5512997402674"],
            "https://robisonsouza.com.br/": ["Robison"],
            "https://peritoempsicologiaforense.com.br/": ["Robison"],
          }
          falhas = []
          for url, marcas in SITES.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "RBS-Vigilancia/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      corpo = r.read().decode("utf-8", "ignore")
                      if r.status != 200:
                          falhas.append(f"{url} -> HTTP {r.status}")
                      for m in marcas:
                          if m not in corpo:
                              falhas.append(f"{url} -> marca ausente: {m}")
              except Exception as e:
                  falhas.append(f"{url} -> FORA DO AR: {e}")
          # SENSOR DE CADÊNCIA + AUTOCURA: os 4 sites (agora todos estáticos) publicaram nas últimas 48h?
          # Se algum ficou pra tras, dispara a publicacao dele agora mesmo (nao so avisa por e-mail).
          import json as _json, datetime as _dt
          REPO_DO_BLOG = {
              "https://depoimentoespecial.com.br/blog/posts.json": "depoimentoespecial",
              "https://estudopsicossocial.com.br/blog/posts.json": "estudopsicossocial",
              "https://robisonsouza.com.br/blog/posts.json": "robisonsouza",
              "https://peritoempsicologiaforense.com.br/blog/posts.json": "perito",
          }
          curados = []
          for blog, repo in REPO_DO_BLOG.items():
              try:
                  req = urllib.request.Request(blog, headers={"User-Agent": "RBS-Vigilancia/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      posts = _json.load(r)
                  lista = posts if isinstance(posts, list) else posts.get("posts", [])
                  datas = [p.get("iso") or p.get("date") or p.get("data","") for p in lista]
                  ultima = max((d for d in datas if d), default="")
                  if not ultima:
                      falhas.append(f"{blog} -> sem datas legiveis")
                      continue
                  dias = (_dt.date.today() - _dt.date.fromisoformat(ultima[:10])).days
                  if dias > 1:
                      if not os.environ.get("DISPATCH_TOKEN"):
                          falhas.append(f"{blog} -> BLOG PARADO ha {dias} dias (ultimo: {ultima[:10]}) — SEM DISPATCH_TOKEN configurado, nao foi possivel autocurar")
                          continue
                      try:
                          disp_req = urllib.request.Request(
                              f"https://api.github.com/repos/RBS2027/{repo}/actions/workflows/publicar-diario.yml/dispatches",
                              method="POST",
                              data=_json.dumps({"ref": "main"}).encode(),
                              headers={
                                  "Authorization": f"Bearer {os.environ['DISPATCH_TOKEN']}",
                                  "Accept": "application/vnd.github+json",
                                  "Content-Type": "application/json",
                              },
                          )
                          with urllib.request.urlopen(disp_req, timeout=30) as dr:
                              pass
                          curados.append(f"{repo} (parado ha {dias} dias, ultimo: {ultima[:10]})")
                      except Exception as de:
                          falhas.append(f"{blog} -> BLOG PARADO ha {dias} dias E FALHA AO AUTOCURAR: {de}")
              except Exception as e:
                  falhas.append(f"{blog} -> falha ao checar cadencia: {e}")
          if curados:
              print("::warning title=AUTOCURA ACIONADA::Disparada publicacao manual em: " + "; ".join(curados))
          if falhas:
              for f in falhas:
                  print(f"::error title=SITE COM PROBLEMA::{f}")
              sys.exit(1)
          print("Os 4 sites no ar e íntegros." + (f" (autocura acionada em {len(curados)} site(s))" if curados else ""))

      - name: Instrucao em caso de falha
        if: failure()
        run: |
          echo "::error title=ABRA O CLAUDE E DIGA::Claude, conserta os sites — chegou alarme do GitHub (vigilancia). Ele investiga a causa e corrige sozinho."
